[workspace]
exclude = ["vendor/evo-libs"]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.13.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/tazerty/evofilm"

[workspace.dependencies]
# internal
evofilm-time = { path = "crates/time" }
evofilm-geom = { path = "crates/geom" }
evofilm-color = { path = "crates/color" }
evofilm-bitstream = { path = "crates/bitstream" }
evofilm-isobmff = { path = "crates/isobmff" }
evofilm-avi = { path = "crates/avi" }
evofilm-matroska = { path = "crates/matroska" }
evofilm-mxf = { path = "crates/mxf" }
evofilm-cfb = { path = "crates/cfb" }
evofilm-mpegts = { path = "crates/mpegts" }
evofilm-mpeg2v = { path = "crates/mpeg2v" }
evofilm-ac3 = { path = "crates/ac3" }
evofilm-mpa = { path = "crates/mpa" }
evofilm-ogg = { path = "crates/ogg" }
evofilm-h264 = { path = "crates/h264" }
evofilm-hevc = { path = "crates/hevc" }
evofilm-vp8 = { path = "crates/vp8" }
evofilm-vp9 = { path = "crates/vp9" }
evofilm-prores = { path = "crates/prores" }
evofilm-dnx = { path = "crates/dnx" }
evofilm-apv = { path = "crates/apv" }
evofilm-dng = { path = "crates/dng" }
evofilm-av1 = { path = "crates/av1" }
evofilm-aac = { path = "crates/aac" }
evofilm-flac = { path = "crates/flac" }
evofilm-opus = { path = "crates/opus" }
evofilm-h264enc = { path = "crates/h264enc" }
evofilm-audio-dsp = { path = "crates/audio-dsp" }
evofilm-frame = { path = "crates/frame" }
evofilm-media = { path = "crates/media" }
evofilm-codecs = { path = "crates/codecs" }
evofilm-project = { path = "crates/project" }
evofilm-edit = { path = "crates/edit" }
evofilm-interchange = { path = "crates/interchange" }
evofilm-text = { path = "crates/text" }
evofilm-captions = { path = "crates/captions" }
evofilm-speech = { path = "crates/speech" }
evofilm-tts = { path = "crates/tts" }
evofilm-tts-text = { path = "crates/tts-text" }
evofilm-render = { path = "crates/render" }
evofilm-gpu = { path = "crates/gpu" }
evofilm-scopes = { path = "crates/scopes" }
evofilm-export = { path = "crates/export" }
evofilm-format = { path = "crates/format" }
evofilm-engine = { path = "crates/engine" }
evofilm-ui-egui = { path = "crates/ui-egui" }
evofilm-automation = { path = "crates/automation" }
evofilm-platform = { path = "crates/platform" }
evofilm-testkit = { path = "crates/testkit" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
log = "0.4"
# All date/time conversion goes through chrono (no hand-rolled calendar code beyond the 400-year range extension; AGENTS.md).
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
rayon = "1"
proptest = "1"
roxmltree = "0.21"
evo-docpath = { path = "vendor/evo-libs/evo-docpath" }
evo-media = { path = "vendor/evo-libs/evo-media", default-features = false }

# ui
# Shared frontend components; keep this dependency above the engine boundary.
evo-ui = { path = "vendor/evo-libs/evo-ui", features = ["serde"] }
egui = "0.36"
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"

# Line tables keep file and line in panics and backtraces at a fraction of full debug info's size;
# dependencies need none.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

# Codec hot loops: debug-build tests (RFC/oracle vectors) are minutes slower below opt-level 3.
[profile.dev.package.evofilm-h264]
opt-level = 3

[profile.dev.package.evofilm-h264enc]
opt-level = 3

[profile.dev.package.evofilm-hevc]
opt-level = 3

[profile.dev.package.evofilm-prores]
opt-level = 3

[profile.dev.package.evofilm-dnx]
opt-level = 3

[profile.dev.package.evofilm-apv]
opt-level = 3

[profile.dev.package.evofilm-dng]
opt-level = 3

[profile.dev.package.evofilm-av1]
opt-level = 3

[profile.dev.package.evofilm-aac]
opt-level = 3

[profile.dev.package.evofilm-flac]
opt-level = 3

# Audio effects: realtime-factor tests and long convolution / spectral runs.
[profile.dev.package.evofilm-audio-dsp]
opt-level = 3

[profile.dev.package.evofilm-mxf]
opt-level = 3

[profile.dev.package.evofilm-opus]
opt-level = 3

[profile.dev.package.evofilm-vp8]
opt-level = 3

[profile.dev.package.evofilm-vp9]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
