[package]
name = "evo-media"
description = "Bit-level I/O and clean-room ISO BMFF (MP4), QuickTime (MOV) and Matroska (MKV, WebM) demuxers and muxers."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "vendor/evo-libs"

[features]
default = ["isobmff"]
bitstream = []
isobmff = ["bitstream", "dep:thiserror"]
matroska = []

[dependencies]
thiserror = { version = "2", optional = true }

