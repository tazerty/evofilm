[package]
name = "evofilm-engine"
description = "EvoFilm engine façade: session, command registry, history, media pool"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
# Speech-to-text with Whisper (candle, CPU). Off by default and in wasm builds.
whisper = ["evofilm-speech/whisper"]
# Speech-model downloads over HTTPS.
speech-download = ["evofilm-speech/download"]
# Natural voices for Text to Speech: Kokoro-82M on candle (CPU) and their download.
neural-voices = ["evofilm-tts/kokoro", "speech-download"]

[dependencies]
evofilm-time = { workspace = true }
evofilm-geom = { workspace = true }
evofilm-color = { workspace = true }
evofilm-frame = { workspace = true }
evofilm-media = { workspace = true }
evofilm-codecs = { workspace = true }
evofilm-project = { workspace = true }
evofilm-edit = { workspace = true }
evofilm-render = { workspace = true }
evofilm-scopes = { workspace = true }
evofilm-text = { workspace = true }
evofilm-audio-dsp = { workspace = true }
evofilm-export = { workspace = true }
evofilm-mxf = { workspace = true }
evofilm-format = { workspace = true }
evofilm-interchange = { workspace = true }
evofilm-captions = { workspace = true }
evofilm-speech = { workspace = true }
evofilm-tts = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
chrono = { workspace = true }
evo-docpath = { workspace = true }
web-time = "1"

[dev-dependencies]
evofilm-testkit = { workspace = true }
evofilm-dng = { workspace = true, features = ["writer"] }
evofilm-isobmff = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "gif"] }
