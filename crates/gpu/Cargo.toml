[package]
name = "evofilm-gpu"
description = "wgpu compositor: YUV/RGB layer sampling, linear-light premultiplied compositing in WGSL"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
evofilm-color = { workspace = true }
evofilm-frame = { workspace = true }
evofilm-geom = { workspace = true }
evofilm-project = { workspace = true }
evofilm-render = { workspace = true }
evofilm-time = { workspace = true }
wgpu = { version = "30", default-features = false, features = ["wgsl"] }
log = { workspace = true }
pollster = "0.4"
rayon = { workspace = true }

[dev-dependencies]
pollster = "0.4"
evofilm-export = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
wgpu = { version = "30", features = ["wgsl", "metal", "vulkan", "dx12", "gles"] }
evofilm-media = { workspace = true }
evofilm-time = { workspace = true }
