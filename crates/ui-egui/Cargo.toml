[package]
name = "evofilm-ui-egui"
description = "The EvoFilm egui frontend (swappable): panels, docking, timeline, monitors, control channel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
evo-ui = { workspace = true }
evofilm-time = { workspace = true }
evofilm-geom = { workspace = true }
evofilm-color = { workspace = true }
evofilm-frame = { workspace = true }
evofilm-media = { workspace = true }
evofilm-project = { workspace = true }
evofilm-tts = { workspace = true }
evofilm-edit = { workspace = true }
evofilm-render = { workspace = true }
evofilm-text = { workspace = true }
evofilm-audio-dsp = { workspace = true }
evofilm-engine = { workspace = true }
evofilm-export = { workspace = true }
evofilm-gpu = { workspace = true }
evofilm-scopes = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit"] }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
rayon = { workspace = true }
web-time = "1"
# Unicode Bidirectional Algorithm for Arabic and Hebrew captions in reading order (MIT OR Apache-2.0).
unicode-bidi = "0.3.18"
# PNG encoding of clipboard images (menus.rs). Evora fork (E1): no longer used for a wordmark.
image = { version = "0.25", default-features = false, features = ["png"] }

# Thread/process CPU clocks for frame-job profiling (safe wrappers; see frames.rs).
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "time"] }
# the same clocks on Windows (GetThreadTimes / GetProcessTimes behind a safe API; MIT OR Apache-2.0)
[target.'cfg(windows)'.dependencies]
cpu-time = "1"

[dev-dependencies]
pollster = "0.4"
evofilm-codecs = { workspace = true }
# the bench registers OS hardware decoders as the desktop app does (dev-dependency only: ui-egui
# itself stays OS-independent and web-portable)
evofilm-platform = { workspace = true }
evofilm-interchange = { workspace = true }
egui_kittest = { workspace = true, features = ["eframe", "wgpu"] }
tempfile = "3"

# build.rs bakes contributors/contributors.json into the binary (About ▸ Contributors).
[build-dependencies]
serde_json = { workspace = true }
toml = "1"
