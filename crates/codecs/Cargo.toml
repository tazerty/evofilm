[package]
name = "evofilm-codecs"
description = "Container + codec hub: MP4/MOV, Matroska, MXF, Ogg and MPEG TS/PS sources, image sequences, GOP-aware seeking, decoder registry, audio decoding"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
evofilm-time = { workspace = true }
evofilm-color = { workspace = true }
evofilm-frame = { workspace = true }
evofilm-media = { workspace = true }
evofilm-avi = { workspace = true }
evofilm-isobmff = { workspace = true }
evofilm-matroska = { workspace = true }
evofilm-mxf = { workspace = true }
evofilm-mpegts = { workspace = true }
evofilm-mpeg2v = { workspace = true }
evofilm-ac3 = { workspace = true }
evofilm-mpa = { workspace = true }
evofilm-ogg = { workspace = true }
evofilm-bitstream = { workspace = true }
evofilm-h264 = { workspace = true }
evofilm-hevc = { workspace = true }
evofilm-vp8 = { workspace = true }
evofilm-vp9 = { workspace = true }
evofilm-prores = { workspace = true }
evofilm-dnx = { workspace = true }
evofilm-av1 = { workspace = true }
evofilm-apv = { workspace = true }
evofilm-aac = { workspace = true }
evofilm-opus = { workspace = true }
rayon = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
# Decode timing counters (`gop_stats`); std's Instant panics on wasm32.
web-time = "1"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# Bootstrap audio decoding (MPL-2.0, used unmodified); replaced by own decoders over time.
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "mp1", "mp2", "mp3", "flac", "alac", "pcm", "wav", "aiff", "ogg", "vorbis", "isomp4"] }

[dev-dependencies]
evofilm-testkit = { workspace = true }
serde_json = { workspace = true }
