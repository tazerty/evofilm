[package]
name = "evofilm-export"
description = "Export pipeline: parallel render → encode → mux, presets, progress/cancel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
evofilm-time = { workspace = true }
evofilm-frame = { workspace = true }
evofilm-color = { workspace = true }
evofilm-media = { workspace = true }
evofilm-project = { workspace = true }
evofilm-render = { workspace = true }
evofilm-audio-dsp = { workspace = true }
evofilm-geom = { workspace = true }
evofilm-text = { workspace = true }
evofilm-isobmff = { workspace = true }
evofilm-prores = { workspace = true }
evofilm-dnx = { workspace = true }
evofilm-apv = { workspace = true }
evofilm-mxf = { workspace = true }
evofilm-aac = { workspace = true }
evofilm-flac = { workspace = true }
evofilm-h264enc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true }
web-time = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "tiff", "bmp"] }

[dev-dependencies]
evofilm-testkit = { workspace = true }
evofilm-codecs = { workspace = true }
